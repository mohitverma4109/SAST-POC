name: IaC Security Scan

on: workflow_dispatch

permissions:
  contents: read
  security-events: write

jobs:
  terrascan:
    name: Terrascan IaC Scan
    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # Checkout Repository
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # Run Terrascan
      # --------------------------------
      - name: Run Terrascan
        id: terrascan
        uses: tenable/terrascan-action@main
        with:
          iac_type: 'terraform'
          iac_version: 'v14'
          policy_type: 'aws'
          only_warn: true
          sarif_upload: true
          iac_dir: '.'

      # --------------------------------
      # Check SARIF File
      # --------------------------------
      - name: Validate Terrascan SARIF
        if: always()
        run: |
          echo "Checking Terrascan SARIF file..."

          if [ ! -f terrascan.sarif ]; then
            echo "ERROR: terrascan.sarif was not generated."
            exit 1
          fi

          echo "SARIF file size:"
          ls -lh terrascan.sarif

          echo "SARIF file content:"
          cat terrascan.sarif

          echo "Validating JSON..."

          python3 -m json.tool terrascan.sarif > /dev/null

          echo "SARIF JSON is valid."

      # --------------------------------
      # Upload SARIF to GitHub
      # --------------------------------
      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: terrascan.sarif
          category: terrascan
