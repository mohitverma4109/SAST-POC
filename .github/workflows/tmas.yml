name: Trend Micro Shift-Left Container Security

# Runs on every PR (shift-left gate before merge) and on pushes to main
# (final gate before pushing the image to the registry).
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  IMAGE_NAME: tmas-ecr-repo                          # your ECR repo name
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: us-west-2                              # your AWS region

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # needed if you want to upload SARIF to GitHub code scanning

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- BUILD ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # ---------- SHIFT-LEFT SCAN ----------
      # Trend Vision One Artifact Scanner (tmas) - official CLI for
      # Container Security shift-left scanning (vulnerabilities, malware,
      # secrets, and misconfig checks against your Vision One policy).
      - name: Install Trend Micro Artifact Scanner (tmas)
        run: |
          curl -sSL https://cli.artifactscan.cloudone.trendmicro.com/tmas-cli/latest/tmas-cli_Linux_x86_64.tar.gz -o tmas.tar.gz
          tar -xzf tmas.tar.gz
          chmod +x tmas
          sudo mv tmas /usr/local/bin/tmas

      # tmas reads the API key directly from the TMAS_API_KEY environment
      # variable at scan time — there is no separate "configure"/login step.

      - name: Scan image (vulnerabilities, malware, secrets, SBOM)
        id: scan
        env:
          TMAS_API_KEY: ${{ secrets.TMAS_API_KEY }}
        run: |
          tmas scan docker:${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -VMS \
            --saveSBOM \
            --region ${{ vars.TM_REGION || 'us-1' }} \
            --resultFile scan-result.json

      - name: Upload scan results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendmicro-scan-results
          path: scan-result.json

      # ---------- POLICY GATE ----------
      # Instead of depending on a named Vision One console policy (those are
      # for Kubernetes runtime admission control, not CI-time gating), we
      # evaluate the scan JSON directly: fail the job if any critical
      # vulnerability or malware was found.
      - name: Evaluate scan results (fail on critical/malware)
        run: |
          echo "Inspecting scan-result.json for critical vulnerabilities and malware..."
          cat scan-result.json | head -c 2000
          echo ""
          echo "---"
          # NOTE: run this once first to confirm the real field names/paths in
          # your scan-result.json, then we tighten this jq query together.
          CRITICAL_COUNT=$(jq '[.. | objects | select(.severity? == "critical")] | length' scan-result.json)
          MALWARE_COUNT=$(jq '[.. | objects | select(.malware? != null)] | length' scan-result.json)
          echo "Critical vulnerabilities found: $CRITICAL_COUNT"
          echo "Malware indicators found: $MALWARE_COUNT"
          if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$MALWARE_COUNT" -gt 0 ]; then
            echo "::error::Image failed the security gate — critical vulnerabilities or malware detected. Blocking push."
            exit 1
          fi
          echo "Image passed the security gate."

      # ---------- PUSH TO ECR (only reached if the scan + policy gate above passed) ----------
      # Because these steps come after "Enforce Vision One policy gate", a failed
      # scan stops the job right there — GitHub Actions never executes the steps
      # below, so a vulnerable/malware-flagged image is never pushed to ECR.
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push clean image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} $ECR_REGISTRY/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} $ECR_REGISTRY/${{ env.IMAGE_NAME }}:latest
          docker push $ECR_REGISTRY/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push $ECR_REGISTRY/${{ env.IMAGE_NAME }}:latest
